# The IntelCost bench.
#
# A local clone of the whole system with ephemeral data and fakes for every external
# service. Testing is conducted here, not written.
#
#   docker compose up -d --build      bring it up
#   docker compose logs -f api        watch the api
#   docker compose down -v            reset to clean
#
# Data is deliberately NOT persisted. A named volume for Postgres would hide the
# migration bugs a customer meets on a fresh install.

name: intelcost-bench

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: intelcost
      POSTGRES_PASSWORD: intelcost
      POSTGRES_DB: intelcost
    ports:
      - "5433:5432"   # 5433 so it never fights a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelcost -d intelcost"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Docker Hub no longer serves minio/minio; quay.io is the official home.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console, browse what the app wrote
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    logging:
      driver: none    # MailHog logs every connection at debug volume

  api:
    build:
      context: ../intelcost-app-fastapi
      # The dev stage carries ruff and mypy, so the api gates run in here:
      #   docker compose exec api sh -lc "ruff check app alembic scripts && mypy app"
      # Production images build the last stage, `production`, which has neither.
      target: dev
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://intelcost:intelcost@postgres:5432/intelcost
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: bench-only-secret-not-for-anything-real
      # Short-lived tokens on demand, so re-auth on refresh can be driven in minutes rather
      # than half an hour (F8-S3). browser/f8-s3.sh sets it and puts it back.
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-30}"
      S3_ENDPOINT_URL: http://minio:9000
      # The browser cannot resolve "minio", so presigned links are signed against the
      # host it actually calls. See app/config.py.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: intelcost-local
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      APP_URL: http://localhost:5173
      # Geo. Empty by default, which is what makes the bench inert and every signup
      # Tier 1. Point them at the fake to drive the MaxMind branches (F2-S5, F2-S8):
      #   FAKE_VPN=1 docker compose --profile fakes up -d maxmind-fake
      #   MAXMIND_BASE_URL=http://maxmind-fake:8080 MAXMIND_ACCOUNT_ID=x MAXMIND_LICENSE_KEY=y docker compose up -d api
      MAXMIND_BASE_URL: "${MAXMIND_BASE_URL:-https://geoip.maxmind.com}"
      MAXMIND_ACCOUNT_ID: "${MAXMIND_ACCOUNT_ID:-}"
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY:-}"
    # Migrations run on start, so a fresh bench is a working bench.
    #
    # `exec`, so uvicorn replaces the shell as PID 1 and receives the stop signal. Without
    # it `sh` swallows SIGTERM, Docker kills uvicorn ten seconds later, and every open
    # realtime socket dies without a close frame (1006) instead of being told the server
    # is restarting (1012), which is what the app reconnects on at once (F8-S1 AC5).
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../intelcost-app-fastapi/app:/srv/app
      - ../intelcost-app-fastapi/alembic:/srv/alembic
      # Scripts are run from in here, because a host without Python cannot run them
      # from outside: docker compose exec api python scripts/<name>.py
      - ../intelcost-app-fastapi/scripts:/srv/scripts
      # Bench drives that are not browser drives: a rule the api enforces with no
      # route to reach it yet. Bench-owned, so they live here and not in the api repo.
      - ./drives:/srv/drives:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../intelcost-app-fastapi
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://intelcost:intelcost@postgres:5432/intelcost
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: bench-only-secret-not-for-anything-real
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: intelcost-local
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      APP_URL: http://localhost:5173
      # Polling, for the reason DEV_WATCH_POLL exists on the app: a bind mount from a
      # Windows or macOS host may deliver no filesystem events into the container.
      WATCHFILES_FORCE_POLLING: "true"
    # Restarted on every .py change under app/, as the api is by --reload (D-30). Left
    # alone, Celery keeps the code it started with, and on this bench it once ran pre-F3
    # code for weeks. browser/bench-code.mjs fails if it falls behind again. watchfiles
    # comes with uvicorn[standard], so this adds nothing to the image.
    command: >
      watchfiles --filter python --sigint-timeout 10
      "celery -A app.worker.celery_app.celery_app worker --loglevel=info --concurrency=2"
      /srv/app
    volumes:
      - ../intelcost-app-fastapi/app:/srv/app
    depends_on:
      api:
        condition: service_started

  # The scheduler. It only enqueues: at 03:00 UTC it puts `purge_trashed_projects` on
  # the queue and the worker runs it (F4-S27). Production scheduling is Abdullah's
  # (D-11). Restarted on a code change like the worker, since the schedule is code.
  # The schedule file goes to /tmp: it is state for this one container, not the repo's.
  beat:
    build:
      context: ../intelcost-app-fastapi
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://intelcost:intelcost@postgres:5432/intelcost
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: bench-only-secret-not-for-anything-real
      S3_BUCKET: intelcost-local
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      watchfiles --filter python --sigint-timeout 10
      "celery -A app.worker.celery_app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule"
      /srv/app
    volumes:
      - ../intelcost-app-fastapi/app:/srv/app
    depends_on:
      worker:
        condition: service_started

  app:
    build:
      context: ../intelcost-app-react
      target: dev
    environment:
      # Compiled into what the BROWSER runs, so these are addresses the browser
      # resolves from the host. The service name "api" means nothing to it.
      # Same reason S3_PUBLIC_ENDPOINT_URL exists above.
      VITE_API_URL: http://localhost:8000
      VITE_MARKETING_URL: http://localhost:3000
      # Node side, not the browser: it turns on polling in the Vite watcher.
      # A bind mount from a Windows or macOS host delivers no filesystem events
      # into the container, and without an event Vite serves an edited module
      # from its transform cache forever, hard refresh or not.
      DEV_WATCH_POLL: "1"
    volumes:
      # Source only. node_modules stays the image's, so a host install built for
      # another platform cannot leak in and break the dev server.
      - ../intelcost-app-react/src:/app/src
      - ../intelcost-app-react/public:/app/public
      - ../intelcost-app-react/index.html:/app/index.html
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  # A stand-in for MaxMind Insights, so the signup gate's geo branches can be driven
  # without a paid key (F2-S5). Off by default, on the "fakes" profile.
  #
  #   docker compose --profile fakes up -d maxmind-fake
  #   # then point the api at it and restart it:
  #   MAXMIND_BASE_URL=http://maxmind-fake:8080 MAXMIND_ACCOUNT_ID=x MAXMIND_LICENSE_KEY=y
  #
  # What it claims is set by environment. See fakes/maxmind/server.py.
  maxmind-fake:
    profiles: ["fakes"]
    image: python:3.14-slim
    environment:
      FAKE_COUNTRY: "${FAKE_COUNTRY:-US}"
      FAKE_VPN: "${FAKE_VPN:-0}"
      FAKE_STATUS: "${FAKE_STATUS:-200}"
      FAKE_BODY: "${FAKE_BODY:-insights}"
    volumes:
      - ./fakes/maxmind:/fake:ro
    command: python /fake/server.py
    ports:
      - "8090:8080"

  # The bench's browser (D-16). Off by default: it sits on the "browser" profile, so
  # `docker compose up -d` is exactly what it was. A pass runs it and it exits.
  #
  #   docker compose --profile browser build browser
  #   docker compose --profile browser run --rm browser node scripts/f2-s3.mjs
  #
  # It drives the HOST's published ports rather than the compose network, because the
  # app bundle is compiled against localhost:8000 — see browser/README.md.
  browser:
    profiles: ["browser"]
    build:
      context: ./browser
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Scripts only, mounted where the image already put them, so a fixture is
      # edited without a rebuild. node_modules stays the image's, one level up at
      # /drive, for the same reason the app image keeps its own.
      - ./browser:/drive/scripts
      # Both source trees, read-only. A fixture that has to assert the ABSENCE of a
      # pattern — no gate anywhere tests a role (F3-S3) — cannot do it by clicking,
      # and a grep run on the host is a grep nobody re-runs.
      - ../intelcost-app-react/src:/src/app:ro
      - ../intelcost-app-fastapi/app:/src/api:ro
    working_dir: /drive
    init: true
